# Produksi (Coolify): app REIN + postgres 16 + OpenWA (baileys). PRD §11, BUILD-KICKOFF §B.
# Semua nilai ${...} diisi lewat environment/secret Coolify — tidak ada secret di file ini.
# Domain, TLS, dan pembatasan akses kantor/VPN diatur di Coolify untuk service `app`.
name: rein-v2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      TZ: Asia/Jakarta
      APP_URL: ${APP_URL:-https://staff.remula.online}
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://rein:${POSTGRES_PASSWORD}@postgres:5432/rein
      AUTH_PEPPER: ${AUTH_PEPPER:?isi AUTH_PEPPER}
      # Jalankan sekali di terminal app: node dist/seed-cli.js, lalu kosongkan password seed.
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin REIN}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://staff.remula.online/auth/google/callback}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-null}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_SENDER_NAME: ${GMAIL_SENDER_NAME:-REIN}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/uploads
      WA_PROVIDER: openwa
      OPENWA_URL: http://openwa:2785
      OPENWA_API_KEY: ${OPENWA_API_KEY:?isi OPENWA_API_KEY}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-rein}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:?isi OPENWA_WEBHOOK_SECRET (min 16 karakter)}
      OPENWA_WEBHOOK_URL: http://app:3000/webhooks/openwa
      REIN_WA_NUMBER: ${REIN_WA_NUMBER:-}
    volumes:
      - app-uploads:/app/uploads
    expose:
      - '3000'
    networks: [rein]
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - 'no-new-privileges:true'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rein
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}
      POSTGRES_DB: rein
      OPENWA_DB_PASSWORD: ${OPENWA_DB_PASSWORD:?isi OPENWA_DB_PASSWORD}
      TZ: UTC
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rein -d rein']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [rein]
    mem_limit: 768m

  openwa:
    image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '2785'
      HOME: /tmp
      ENGINE_TYPE: baileys
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: openwa
      DATABASE_USERNAME: openwa
      DATABASE_PASSWORD: ${OPENWA_DB_PASSWORD}
      REDIS_ENABLED: 'false'
      QUEUE_ENABLED: 'false'
      SEND_PACING_ENABLED: 'true'
      RESOLVE_LID_TO_PHONE: 'true'
      API_MASTER_KEY: ${OPENWA_API_KEY}
      # Webhook OpenWA → REIN di jaringan internal Docker.
      SSRF_ALLOWED_HOSTS: app
    # TIDAK ada `ports:` — OpenWA hanya bisa dijangkau dari jaringan internal.
    # Dashboard (scan QR) dibuka lewat VPN, mis. port-forward sementara dari Coolify.
    expose:
      - '2785'
    volumes:
      - openwa-data:/app/data
    networks: [rein]
    mem_limit: 512m
    security_opt:
      - 'no-new-privileges:true'

networks:
  rein:

volumes:
  app-uploads:
  pg-data:
  openwa-data:
