<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>System Status ‚Äî Standby</title>
<style>
  :root {
    --bg: #0A0A0C;
    --accent: #E5484D;       /* maintenance = red, drives logo + accents via mask */
    --text-muted: #6E6E75;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: #E8E8EC;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* subtle dot-grid texture so the background isn't flat */
  .pattern-bg {
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center,
      color-mix(in srgb, var(--accent) 8%, transparent) 0%,
      transparent 45%);
  }

  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(24px, 3.4vh, 40px);
  }

  /* clock/date now sits above the logo, monospace for a technical readout feel */
  .datetime {
    text-align: center;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  .datetime .clock {
    font-size: clamp(20px, 2.6vw, 34px);
    color: #E8E8EC;
    letter-spacing: 2px;
  }
  .datetime .date-label {
    font-size: clamp(11px, 1.1vw, 14px);
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .orbit-wrap {
    position: relative;
    width: clamp(220px, 22vw, 420px);
    height: clamp(220px, 22vw, 420px);
    display: flex; align-items: center; justify-content: center;
  }

  .orbit-track {
    position: absolute; inset: 0;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 50%;
  }

  .spin {
    position: absolute; inset: 0;
    animation: spin 9s linear infinite;
  }
  .spin.reverse {
    animation-duration: 14s;
    animation-direction: reverse;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .orbit-dot {
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px var(--accent);
  }
  .spin.reverse .orbit-dot {
    width: 5px; height: 5px;
    margin-left: -2.5px;
    opacity: 0.7;
  }

  /* logo as a mask: shape comes from RePhot.svg, color comes from --accent.
     Change --accent and the logo recolors exactly, no filter guesswork. */
  .logo-mask {
    position: relative;
    z-index: 1;
    width: 62%;
    height: 62%;
    background-color: var(--accent);
    -webkit-mask-image: url('RePhot.svg');
    mask-image: url('RePhot.svg');
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: contain;
    mask-size: contain;
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.035); }
  }

  .reason {
    max-width: min(80vw, 640px);
    text-align: center;
    font-size: clamp(11px, 1.2vw, 15px);
    color: var(--text-muted);
    letter-spacing: 0.5px;
    line-height: 1.5;
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
    display: none;
  }

  .status-label {
    font-size: clamp(15px, 1.6vw, 22px);
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .progress-track {
    width: clamp(160px, 14vw, 240px);
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 2.6s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(280%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .spin, .logo-mask, .progress-fill { animation: none; }
  }
</style>
</head>
<body>

  <div class="pattern-bg"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="datetime">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-label" id="dateLabel">-- --- ----</div>
    </div>

    <div class="orbit-wrap">
      <div class="orbit-track"></div>
      <div class="spin"><div class="orbit-dot"></div></div>
      <div class="spin reverse"><div class="orbit-dot"></div></div>
      <div class="logo-mask"></div>
    </div>

    <div class="status-label" id="statusLabel">Maintenance</div>
    <div class="reason" id="reason"></div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

<script>
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("id-ID", { hour12: false });
    document.getElementById("dateLabel").textContent = now.toLocaleDateString("id-ID", {
      day: "2-digit", month: "short", year: "numeric"
    });
  }
  tick();
  setInterval(tick, 1000);

  // Optional context from the embedder: ?label= overrides the status word,
  // ?reason= shows the cause line (e.g. why a channel is in standby).
  const params = new URLSearchParams(location.search);
  const label = params.get("label");
  if (label) document.getElementById("statusLabel").textContent = label;
  const reason = params.get("reason");
  if (reason) {
    const el = document.getElementById("reason");
    el.textContent = reason;
    el.style.display = "block";
  }
</script>

</body>
</html>
