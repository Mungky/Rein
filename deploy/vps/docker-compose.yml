# ==========================================================================
#  R-Net Relay Pusat — MediaMTX + Mosquitto di VPS (via Coolify)
# ==========================================================================
#  Cara pakai (detail di PANDUAN-VPS-RELAY.md):
#    Coolify → + New → Docker Compose → paste seluruh file ini →
#    ganti semua "GANTI_..." → set Environment Variable MQTT_PASS →
#    domain https://stream.remula-inti.com dipetakan ke service mediamtx
#    port 8888 → Deploy.
#
#  Arsitektur:
#    OBS site ──RTMP push (1935)──▶ mediamtx ──LL-HLS (8888)──▶ Coolify/Traefik
#                                                                (HTTPS domain tetap)
#    V-Box    ──MQTT (1883)──▶ mosquitto ◀── bridge historian (resource terpisah)
#
#  Site meng-upload SEKALI; VPS yang melayani semua penonton.
# ==========================================================================

services:
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    ports:
      - "1935:1935"        # RTMP ingest dari OBS tiap site
      - "8890:8890/udp"    # SRT ingest — tahan jaringan jelek (lihat panduan §11)
      - "8189:8189/udp"    # WebRTC media (ICE) — wajib utk delay <1 dtk
    expose:
      - "8888"             # LL-HLS   — domain Coolify: stream.remula-inti.com:8888
      - "8889"             # WebRTC/WHEP — domain Coolify: webrtc.remula-inti.com:8889
    configs:
      - source: mediamtx-config
        target: /mediamtx.yml

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"        # MQTT dari V-Box (batasi via firewall bila bisa)
    environment:
      MQTT_USER: ${MQTT_USER:-vbox}
      MQTT_PASS: ${MQTT_PASS:?set MQTT_PASS di Environment Variables Coolify}
    configs:
      - source: mosquitto-config
        target: /mosquitto/config/mosquitto.conf
    # Buat file password dari env saat start, lalu jalankan broker.
    entrypoint:
      - sh
      - -c
      - >
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASS"
        && exec mosquitto -c /mosquitto/config/mosquitto.conf

configs:
  mosquitto-config:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous false
      password_file /mosquitto/config/passwd
      persistence false
      log_dest stdout
      log_type error
      log_type warning

  mediamtx-config:
    content: |
      # ── MediaMTX relay pusat R-Net ──
      logLevel: info
      api: no
      rtsp: no

      rtmp: yes
      rtmpAddress: :1935

      # SRT — jalur alternatif yang TAHAN jaringan jelek (UDP + koreksi paket
      # hilang). Pakai ini bila RTMP putus-nyambung. Akun & path sama.
      srt: yes
      srtAddress: :8890

      hls: yes
      hlsAddress: :8888
      hlsVariant: lowLatency
      hlsSegmentDuration: 1s        # HARUS = Keyframe Interval OBS (1 detik)
      hlsPartDuration: 200ms
      hlsSegmentCount: 7
      hlsAllowOrigins: ["https://rein.remula-inti.com"]

      # ── WebRTC (WHEP) — jalur real-time <1 detik. Sinyal lewat domain HTTPS
      # (webrtc.remula-inti.com → port 8889 via Coolify), media lewat UDP 8189
      # langsung ke IP VPS. Browser R-Net mencoba jalur ini dulu bila kolom
      # "URL WebRTC" stream diisi, lalu otomatis balik ke HLS bila gagal.
      webrtc: yes
      webrtcAddress: :8889
      webrtcEncryption: no          # TLS sinyal diurus Traefik; media selalu terenkripsi (SRTP)
      webrtcLocalUDPAddress: :8189
      webrtcIPsFromInterfaces: no   # jangan iklankan IP internal docker
      webrtcAdditionalHosts: [stream.remula-inti.com]  # alamat publik utk media

      authMethod: internal
      authInternalUsers:
        # ── PENONTON: dipakai R-Net > Channel > Sumber Stream (user/pass read).
        #    Boleh membaca SEMUA stream.
        - user: rein-viewer
          pass: GANTI_PASSWORD_VIEWER
          permissions:
            - action: read

        # ── PEMANCAR per site: hanya boleh mengisi path miliknya sendiri.
        #    (site Lombok tidak mungkin menimpa stream site lain)
        - user: site-server
          pass: GANTI_PASSWORD_SITE_SERVER
          permissions:
            - action: publish
              path: server
        - user: site-lombok
          pass: GANTI_PASSWORD_SITE_LOMBOK
          permissions:
            - action: publish
              path: lombok
        # Tambah site baru: salin blok di atas + tambah path di bawah.

      paths:
        server:
          source: publisher
        lombok:
          source: publisher
        # Kamera RTSP langsung (TANPA OBS) — VPS menarik sendiri dari kamera:
        # cctv-gudang:
        #   source: rtsp://user:pass@ip-kamera:554/stream1
        #   sourceOnDemand: yes    # hanya ditarik saat ada yang menonton (hemat)
