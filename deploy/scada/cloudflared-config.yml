# Cloudflare Tunnel config untuk REIN SCADA Monitor
# ===================================================
# Meneruskan HLS dari MediaMTX (localhost:8888) ke internet secara aman,
# tanpa membuka port apa pun di router/firewall.
#
# Persiapan satu kali (di PC server, butuh login akun Cloudflare):
#   cloudflared tunnel login
#   cloudflared tunnel create rein-scada
#   cloudflared tunnel route dns rein-scada scada-stream.GANTI_DOMAIN.com
#
# Lalu salin file ini ke: C:\Users\GANTI_USER\.cloudflared\config.yml
# dan ganti GANTI_TUNNEL_ID dengan ID dari perintah `create` di atas
# (nama file .json di folder .cloudflared).

tunnel: rein-scada
credentials-file: C:\Users\GANTI_USER\.cloudflared\GANTI_TUNNEL_ID.json

ingress:
  # Stream HLS SCADA
  - hostname: scada-stream.GANTI_DOMAIN.com
    service: http://127.0.0.1:8888

  # Selain itu: tolak
  - service: http_status:404
