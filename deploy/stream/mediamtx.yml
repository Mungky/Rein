# MediaMTX config untuk REIN SCADA Monitor
# ==========================================
# Alur: OBS --(RTMP, localhost)--> MediaMTX --(LL-HLS, localhost)--> cloudflared --> browser
#
# Catatan versi: sintaks `authInternalUsers` berlaku untuk MediaMTX >= 1.9.
# (Bentuk lama per-path `readUser`/`readPass` sudah deprecated.)
#
# GANTI semua nilai GANTI_* sebelum dipakai. Simpan file ini di folder yang
# sama dengan mediamtx.exe (mis. C:\rein-scada\mediamtx\mediamtx.yml).

logLevel: info

###############################################
# Protokol yang TIDAK dipakai — matikan semua
###############################################
rtsp: no
webrtc: no   # WebRTC tidak bisa lewat Cloudflare Tunnel (media UDP/ICE) — kita pakai HLS
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

###############################################
# RTMP — pintu masuk dari OBS (localhost saja)
###############################################
rtmp: yes
rtmpAddress: 127.0.0.1:1935

###############################################
# HLS — pintu keluar ke browser (via cloudflared)
###############################################
# TUNING LATENSI (baca sebelum mengubah):
#   Nilai di bawah sudah mendekati batas bawah LL-HLS (server-side < ~1 detik).
#   Kalau delay masih 6-10 detik, penyebabnya BUKAN di sini, melainkan:
#     1) Setelan encoder OBS (B-frames/Look-ahead nyala) — perbaiki di OBS dulu.
#     2) Cloudflare Tunnel menahan potongan LL-HLS — batas bawaan tunnel gratis.
#   Cara memisahkan kedua penyebab: lihat PANDUAN-RNET.md bagian Troubleshooting.
#   Menurunkan hlsPartDuration/hlsSegmentCount di bawah nilai ini TIDAK membantu
#   (justru menambah request lewat tunnel = lebih patah-patah).
hls: yes
hlsAddress: 127.0.0.1:8888          # hanya bisa diakses cloudflared di PC yang sama
hlsVariant: lowLatency              # latensi ~3-6 detik (batas praktis lewat Cloudflare Tunnel)
hlsSegmentDuration: 1s              # WAJIB sama dengan Keyframe Interval di OBS (1 detik)
hlsPartDuration: 200ms              # potongan mini LL-HLS; 200ms = seimbang delay vs jumlah request
hlsSegmentCount: 7                  # minimum untuk lowLatency di MediaMTX; jangan diturunkan
# Kunci CORS ke domain frontend REIN (jangan pakai "*")
hlsAllowOrigins: ["https://GANTI_DOMAIN_REIN"]
# Kalau LL-HLS tetap patah-patah lewat tunnel dan Anda lebih pilih STABIL daripada
# delay rendah, ganti baris hlsVariant di atas jadi `mpegts` (lebih tahan banting,
# tapi delay naik jadi ~8-15 detik):
# hlsVariant: mpegts

###############################################
# Autentikasi — tidak ada akses anonim
###############################################
authMethod: internal
authInternalUsers:
  # OBS (publisher) — hanya boleh dari PC ini sendiri
  - user: obs
    pass: GANTI_PASSWORD_PUBLISH
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: scada

  # REIN (viewer) — kredensial ini diisi di dialog "Kelola Stream" di REIN;
  # pemutar REIN mengirimkannya sebagai header "Authorization: Basic" di
  # setiap request (query param ?user=&pass= TIDAK didukung untuk pembacaan
  # HLS di MediaMTX modern — sudah diverifikasi di v1.19)
  - user: rein-viewer
    pass: GANTI_PASSWORD_VIEWER
    permissions:
      - action: read
        path: scada

###############################################
# Path stream
###############################################
paths:
  scada:
    source: publisher
